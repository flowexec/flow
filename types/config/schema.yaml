$schema: "http://json-schema.org/draft-07/schema#"
$id: "https://raw.githubusercontent.com/flowexec/flow/HEAD/types/config/schema.yaml"

title: Config
description: |
  User Configuration for the Flow CLI.
  Includes configurations for workspaces, templates, I/O, and other settings for the CLI.

  It is read from the user's flow config directory:
  - **MacOS**: `$HOME/Library/Application Support/flow`
  - **Linux**: `$HOME/.config/flow`
  - **Windows**: `%APPDATA%\flow`

  Alternatively, a custom path can be set using the `FLOW_CONFIG_PATH` environment variable.

definitions:
  Interactive:
    type: object
    description: Configurations for the interactive UI.
    properties:
      enabled:
        type: boolean
      notifyOnCompletion:
        type: boolean
        description: Whether to send a desktop notification when a command completes.
      soundOnCompletion:
        type: boolean
        description: Whether to play a sound when a command completes.
      mouse:
        type: boolean
        description: |
          Whether the interactive UI responds to the mouse: scrolling, clicking to select, and clicking
          breadcrumbs to go back. Defaults to `true`. While enabled, most terminals require holding
          Shift (Option on iTerm2) to select text.
    required: [ enabled ]

  GitSource:
    type: object
    description: Where a workspace added from a git URL pulls from.
    properties:
      remote:
        type: string
        description: The git remote URL the workspace was cloned from.
      ref:
        type: string
        description: The branch or tag name specified when the workspace was added.
        default: ""
      refType:
        type: string
        enum: ["", "branch", "tag"]
        description: The type of ref. Empty if no ref was specified.
        default: ""
    required: [ remote ]

  LogRetention:
    type: object
    description: |
      Limits on the run logs kept in flow's logs directory. Each time an executable runs, the oldest
      logs are removed until every limit is met. An unset field uses its default; `0` removes that limit.
    properties:
      maxAge:
        type: string
        description: |
          Remove logs older than this duration. Defaults to `720h` (30 days).
        goJSONSchema:
          type: time.Duration
          imports: ["time"]
      maxSizeMB:
        type: integer
        description: Keep the total size of all logs under this many megabytes. Defaults to `500`.
      maxCount:
        type: integer
        description: Keep at most this many logs. Defaults to `1000`.

  ContainerRuntimeCommand:
    type: object
    description: |
      The command this machine runs for one container runtime family, in place of the default
      `docker` or `podman` on the PATH. Use it for a Docker-compatible CLI or a specific engine.
    properties:
      command:
        type: string
        description: |
          The command or path to run, e.g. `/opt/homebrew/bin/docker` or `finch`. Defaults to the
          family name. Any replacement must accept the same `run` and `rm` flags as that runtime.
        default: ""
      args:
        type: array
        items:
          type: string
        description: |
          Global flags placed before every subcommand, e.g. `["--context", "colima"]` for docker or
          `["--connection", "remote"]` for podman.
        default: []

  ContainerRuntimes:
    type: object
    description: Per-family commands for container runtimes on this machine.
    properties:
      docker:
        $ref: '#/definitions/ContainerRuntimeCommand'
      podman:
        $ref: '#/definitions/ContainerRuntimeCommand'

  Container:
    type: object
    description: |
      How this machine runs container executables. A flow file's `container.runtime` says which
      runtime an executable expects; this says what that means here, so flow files stay portable.
    properties:
      runtime:
        type: string
        enum: [auto, docker, podman]
        default: auto
        description: |
          The runtime an executable set to `auto` uses on this machine. `auto` detects one: docker,
          else podman, preferring an engine that is running when both are installed.
      runtimes:
        $ref: '#/definitions/ContainerRuntimes'

  ColorPalette:
    type: object
    description: |
      The color palette for the interactive UI.
      The colors can be either an ANSI 16, ANSI 256, or TrueColor (hex) value.
      If unset, the default color for the current theme will be used.
    properties:
      primary:
        type: string
      secondary:
        type: string
      tertiary:
        type: string
      success:
        type: string
      warning:
        type: string
      error:
        type: string
      info:
        type: string
      body:
        type: string
      emphasis:
        type: string
      border:
        type: string
      white:
        type: string
      black:
        type: string
      gray:
        type: string
      codeStyle:
        type: string
        description: |
          The style of the code block. For example, `monokai`, `dracula`, `github`, etc.
          See [chroma styles](https://github.com/alecthomas/chroma/tree/master/styles) for available style names.

type: object
properties:
  workspaces:
    type: object
    additionalProperties:
      type: string
    description: |
      Map of workspace names to their paths. The path should be a valid absolute path to the workspace directory.
  gitWorkspaces:
    type: object
    additionalProperties:
      $ref: '#/definitions/GitSource'
    description: |
      Map of workspace names to their git source, for workspaces added from a git URL. This is set automatically
      and kept here because the workspace's own flow.yaml is a tracked file that belongs to the upstream repository.
#  remoteWorkspaces:
#    type: object
#    additionalProperties:
#      type: string
#    description: |
#      **UNIMPLEMENTED**
#      A map of remote workspace names to their git repository URLs.
#      The repository URL should be a valid git URL that can be cloned.
#    default: {}
  currentWorkspace:
    type: string
    description: The name of the current workspace. This should match a key in the `workspaces` or `remoteWorkspaces` map.
    default: ""
  workspaceMode:
    type: string
    enum: [fixed, dynamic]
    default: dynamic
    description: |
      The mode of the workspace. This can be either `fixed` or `dynamic`.
      In `fixed` mode, the current workspace used at runtime is always the one set in the currentWorkspace config field.
      In `dynamic` mode, the current workspace used at runtime is determined by the current directory.
      If the current directory is within a workspace, that workspace is used.
  currentNamespace:
    type: string
    description: |
      The name of the current namespace.

      Namespaces are used to reference executables in the CLI using the format `workspace/namespace:name`.
      If the namespace is not set, only executables defined without a namespace will be discovered.
    default: ""
  interactive:
    $ref: '#/definitions/Interactive'
  theme:
    type: string
    enum: [default, everforest, dark, light, dracula, tokyo-night]
    description: The theme of the interactive UI.
    default: default
  colorOverride:
    $ref: '#/definitions/ColorPalette'
    description: |
      Override the default color palette for the interactive UI.
      This can be used to customize the colors of the UI.
  defaultTimeout:
    type: string
    description: |
      The default timeout to use when running executables.
      This should be a valid duration string.
    default: "30m"
    goJSONSchema:
      type: time.Duration
      imports: ["time"]
  templates:
    type: object
    additionalProperties:
      type: string
    description: A map of flowfile template names to their paths.
    default: {}
  defaultLogMode:
    type: string
    goJSONSchema:
      type: io.LogMode
      imports: ["github.com/flowexec/tuikit/io"]
    description: |
      The default log mode to use when running executables.
      This can either be `hidden`, `json`, `logfmt` or `text`

      `hidden` will not display any logs.
      `json` will display logs in JSON format.
      `logfmt` will display logs with a log level, timestamp, and message.
      `text` will just display the log message.
    default: logfmt
  container:
    $ref: '#/definitions/Container'
    description: |
      How container executables run on this machine: the runtime `auto` uses, and the command and
      global flags for each runtime. Manage it with `flow config set container-runtime` and
      `flow config set container-command`.
  logRetention:
    $ref: '#/definitions/LogRetention'
    description: |
      Limits on how many run logs flow keeps, by age, total size, and count.
      Manage them with `flow config set log-retention`.
  vaults:
    type: object
    additionalProperties:
      type: string
    description: |
      A legacy map of vault names to their storage paths, retained for backwards compatibility.
      The authoritative list of vaults is discovered from the vault configuration directory managed
      by flow; this map is no longer required to reference or switch vaults.
  currentVault:
    type: string
    description: The name of the currently active vault.
  updateCheck:
    type: boolean
    description: |
      Whether to check for CLI updates in the background.
      When enabled, flow will periodically check GitHub for a newer version and
      display a notice if one is available after each command.
      Set `FLOW_NO_UPDATE_CHECK=1` to suppress checks regardless of this setting.
    default: false
  customVerbs:
    type: array
    items:
      type: string
    description: |
      Additional executable verbs registered by the user.
      Verbs must be lowercase words made up of letters, numbers, and hyphens.
      Manage them with `flow config add verb` and `flow config remove verb`.
    default: []
required:
  - workspaces
  - currentWorkspace