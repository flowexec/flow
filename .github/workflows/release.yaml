name: Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release'
        required: true

jobs:
  release-binary:
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    outputs:
      # Gates the docs deploy on the release actually existing rather than on this
      # job's overall conclusion, so a failure in a downstream distribution channel
      # (Homebrew, ghcr) cannot skip the schema publish.
      published: ${{ steps.released.outputs.published }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Idempotent so a release that failed partway (e.g. a bad tap credential)
      # can be re-dispatched with the same tag instead of dying here.
      - name: Create Tag
        if: ${{ github.event.inputs.tag != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists locally - reusing"
          elif git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists on origin - fetching"
            git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}"
          else
            git tag "${TAG}"
            git push origin "${TAG}"
          fi

      - name: Extract version from tag
        id: version
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            VERSION="${{ github.event.inputs.tag }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Releasing version: ${VERSION}"

      - name: Install release tools
        run: go install github.com/goreleaser/goreleaser/v2@v2.12.5

      # Binaries, GitHub release, and ghcr images. The Homebrew cask is generated
      # into dist/ here but NOT pushed - see the publish-tap step below.
      - uses: flowexec/action@v1
        with:
          executable: 'publish release --param VERSION=${{ steps.version.outputs.version }}'
          timeout: '30m'
          flow-version: 'main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Records whether the GitHub release exists, regardless of what happened
      # after it was cut. Runs even on failure so the docs gate is accurate.
      - name: Check release published
        id: released
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.version.outputs.version }}" \
               --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "published=true" >> $GITHUB_OUTPUT
            echo "Release ${{ steps.version.outputs.version }} is published."
          else
            echo "published=false" >> $GITHUB_OUTPUT
            echo "Release ${{ steps.version.outputs.version }} was NOT published."
          fi

      # The tap is a distribution side-channel with its own credential. A 403 here
      # must not cost us the ghcr images or the schema deploy, so it is explicitly
      # non-fatal and reported in the job summary instead.
      - name: Publish Homebrew cask
        id: tap
        if: ${{ always() && steps.released.outputs.published == 'true' }}
        continue-on-error: true
        env:
          HOMEBREW_FLOW_GITHUB_TOKEN: ${{ secrets.HOMEBREW_FLOW_GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_FLOW_GITHUB_TOKEN:-}" ]; then
            echo "HOMEBREW_FLOW_GITHUB_TOKEN is not set" >&2
            exit 1
          fi
          CASK="dist/homebrew/Casks/flow.rb"
          test -f "$CASK" || { echo "cask not generated at $CASK" >&2; exit 1; }

          TMP="$(mktemp -d)"
          git clone --depth 1 \
            "https://x-access-token:${HOMEBREW_FLOW_GITHUB_TOKEN}@github.com/flowexec/homebrew-tap.git" \
            "$TMP"
          mkdir -p "$TMP/Casks"
          cp "$CASK" "$TMP/Casks/flow.rb"
          git -C "$TMP" add Casks/flow.rb
          if git -C "$TMP" diff --cached --quiet; then
            echo "Cask already up to date for ${VERSION}"
            exit 0
          fi
          git -C "$TMP" -c user.name=goreleaserbot \
                        -c user.email=bot@goreleaser.com \
                        commit -m "Brew cask update for flow version ${VERSION}"
          git -C "$TMP" push origin HEAD

      - name: Report tap outcome
        if: ${{ always() && steps.released.outputs.published == 'true' }}
        run: |
          if [ "${{ steps.tap.outcome }}" = "success" ]; then
            echo "- Homebrew tap updated to ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          else
            {
              echo "### :warning: Homebrew tap NOT updated"
              echo ""
              echo "The release published, but pushing the cask to \`flowexec/homebrew-tap\` failed."
              echo "\`brew upgrade\` will keep serving the previous version until this is resolved."
              echo "Check \`HOMEBREW_FLOW_GITHUB_TOKEN\` (needs Contents: Read and write on the tap repo)."
            } >> $GITHUB_STEP_SUMMARY
          fi

  # Publishing the docs is part of releasing: the site serves the JSON schemas
  # that editors validate flowfiles against, so skipping it ships a release whose
  # schema the world cannot see. This runs here rather than off the tag push
  # because a tag pushed with GITHUB_TOKEN does not trigger workflows.
  release-docs:
    needs: release-binary
    # Gate on the release having been published, not on release-binary's overall
    # conclusion - a Homebrew or ghcr failure must not stop the schemas shipping.
    # Only for a dispatched release: a tag pushed by a human triggers
    # release-docs.yaml on its own, and calling it here too would deploy twice.
    if: ${{ always() && github.event_name == 'workflow_dispatch' && needs.release-binary.outputs.published == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/release-docs.yaml
    secrets: inherit
