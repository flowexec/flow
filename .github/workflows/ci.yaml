name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read # for actions/checkout to fetch code
  security-events: write # for github/codeql-action/upload-sarif to upload SARIF results

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
      # Build the flow under review and run every task with it, so CI exercises
      # the code as it would land on main rather than the released CLI.
      - name: Build flow
        run: go build -o ./bin/flow .
      - uses: flowexec/action@v1
        with:
          executable: 'lint go'
          params: 'CI=true'
          timeout: '5m'
          flow-binary: ./bin/flow
          # Fallback for action releases predating flow-binary; drop once v1 includes it.
          flow-version: 'main'
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v4.37.4
        with:
          sarif_file: lint.sarif
          category: golangci-lint

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # Build the flow under review and run every task with it, so CI exercises
      # the code as it would land on main rather than the released CLI.
      - name: Build flow
        run: go build -o ./bin/flow .
      - uses: flowexec/action@v1
        with:
          executable: 'test unit'
          params: 'CI=true'
          timeout: '5m'
          flow-binary: ./bin/flow
          # Fallback for action releases predating flow-binary; drop once v1 includes it.
          flow-version: 'main'
        id: unit-tests
      - name: Upload unit test coverage
        uses: actions/upload-artifact@v7
        with:
          name: unit-coverage
          path: unit-coverage.out

  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # Build the flow under review and run every task with it, so CI exercises
      # the code as it would land on main rather than the released CLI.
      - name: Build flow
        run: go build -o ./bin/flow .
      - uses: flowexec/action@v1
        with:
          executable: 'test e2e'
          params: 'CI=true'
          timeout: '10m'
          flow-binary: ./bin/flow
          # Fallback for action releases predating flow-binary; drop once v1 includes it.
          flow-version: 'main'
          secrets: |
            test-secret=test-value-from-action
            another-secret=another-test-value
        id: e2e-tests
      - name: Upload E2E test coverage
        uses: actions/upload-artifact@v7
        with:
          name: e2e-coverage
          path: e2e-coverage.out

  coverage:
    needs: [unit-tests, e2e-tests]
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v7
      - name: Download unit test coverage
        uses: actions/download-artifact@v8
        with:
          name: unit-coverage
      - name: Download E2E test coverage
        uses: actions/download-artifact@v8
        with:
          name: e2e-coverage
      - name: Upload to codecov
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          name: cli-coverage
          fail_ci_if_error: true

  validate-generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
      - name: Install mockgen
        run: go install go.uber.org/mock/mockgen@v0.4.0
      # Build the flow under review and run every task with it, so CI exercises
      # the code as it would land on main rather than the released CLI.
      - name: Build flow
        run: go build -o ./bin/flow .
      - uses: flowexec/action@v1
        with:
          executable: 'generate'
          timeout: '10m'
          flow-binary: ./bin/flow
          # Fallback for action releases predating flow-binary; drop once v1 includes it.
          flow-version: 'main'
      - name: Check for uncommitted changes
        uses: flowexec/action@v1
        with:
          executable: 'validate generated'
          timeout: '2m'
          flow-binary: ./bin/flow
          # Fallback for action releases predating flow-binary; drop once v1 includes it.
          flow-version: 'main'

  build-matrix:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
      # Build the flow under review and run every task with it, so CI exercises
      # the code as it would land on main rather than the released CLI. The
      # bootstrap binary lives in ./bin; `build binary` writes its own to .bin.
      - name: Build flow
        shell: bash
        run: go build -o ./bin/${{ runner.os == 'Windows' && 'flow.exe' || 'flow' }} .
      - uses: flowexec/action@v1
        with:
          executable: 'build binary'
          flow-binary: ./bin/${{ runner.os == 'Windows' && 'flow.exe' || 'flow' }}
          # Fallback for action releases predating flow-binary; drop once v1 includes it.
          flow-version: 'main'
          timeout: '10m'
      - uses: flowexec/action@v1
        with:
          executable: 'test binary'
          flow-binary: ./bin/${{ runner.os == 'Windows' && 'flow.exe' || 'flow' }}
          # Fallback for action releases predating flow-binary; drop once v1 includes it.
          flow-version: 'main'
          timeout: '5m'

  python-scripts:
    name: "Test / python script execution"
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # Run this one directly rather than through the action: it exercises flow's
      # own interpreter resolution, so the binary under test must be the one that
      # runs, with no install path in between.
      - name: Build flow
        run: go build -o ./bin/flow .
      - name: Run .py file execution test
        run: ./bin/flow test python-script
        env:
          DISABLE_FLOW_INTERACTIVE: "true"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
      # Build the flow under review and run every task with it, so CI exercises
      # the code as it would land on main rather than the released CLI.
      - name: Build flow
        run: go build -o ./bin/flow .
      - uses: flowexec/action@v1
        with:
          executable: 'scan security'
          timeout: '10m'
          flow-binary: ./bin/flow
          # Fallback for action releases predating flow-binary; drop once v1 includes it.
          flow-version: 'main'
      - name: Upload govuln SARIF file
        uses: github/codeql-action/upload-sarif@v4.37.4
        with:
          sarif_file: govuln.sarif
