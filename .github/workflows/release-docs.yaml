name: Docs

on:
  # Kept for a tag pushed by a human. A release cut through release.yaml pushes
  # its tag with GITHUB_TOKEN, and GitHub does not start workflows from events
  # that token creates - so release.yaml calls this workflow directly instead.
  push:
    tags:
      - "*"
  workflow_call:
    inputs:
      environment:
        description: 'Deployment environment'
        required: false
        default: 'production'
        type: string
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: false
        default: 'production'
        type: choice
        options:
          - production
          - preview

jobs:
  release-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install dependencies
        uses: flowexec/action@v1
        with:
          executable: 'install docs:'
          timeout: '5m'
          flow-version: 'main'
      - name: Deploy to Cloudflare Pages
        uses: flowexec/action@v1
        with:
          executable: "deploy docs:cloudflare ${{ inputs.environment || 'production' }}"
          timeout: '5m'
          flow-version: 'main'
          secrets: |
            {
              "flow-cloudflare-account-id": "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}",
              "flow-cloudflare-api-token": "${{ secrets.CLOUDFLARE_API_TOKEN }}"
            }
