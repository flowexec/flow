version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "08:00"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore: "
    groups:
      # Pre-1.0 and co-developed, so minor bumps can be breaking.
      flowexec-deps:
        patterns:
          - "github.com/flowexec/*"
      # Majors are left out and arrive as their own PRs.
      go-deps:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      go-security:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "08:00"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore: "
    groups:
      github-actions-deps:
        patterns:
          - "*"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "08:00"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore: "
  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "monthly"
      time: "08:00"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore: "
    groups:
      # Majors are left out and arrive as their own PRs.
      docs-deps:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
